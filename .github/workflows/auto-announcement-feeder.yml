name: Auto Announcement Feeder

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - live
  schedule:
    - cron: "20 15 * * 1-5" # 北京时间周一到周五 23:20；schedule 永远只跑安全 dry-run

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: auto-announcement-feeder
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run schedule dry-run
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dry_run')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python auto_announcement_feeder.py --dry-run --use-supabase-watchlist --days 7 --limit 20

      - name: Run live announcement feeder
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_TOKEN_1: ${{ secrets.DEEPSEEK_TOKEN_1 }}
          DEEPSEEK_TOKEN_2: ${{ secrets.DEEPSEEK_TOKEN_2 }}
        run: |
          # live 只建议手动触发；会写 Supabase，并可能调用 DeepSeek
          python auto_announcement_feeder.py --days 7 --limit 20
