name: Command Center 3 Push Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-3-push-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install CI command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Run Command Center 3 push gate
        env:
          PYTHON_BIN: .venv/bin/python
          PUSH_GATE_LOG_PATH: ${{ runner.temp }}/command-center-3-push-gate.log
          PUSH_GATE_REPORT_PATH: ${{ runner.temp }}/command-center-3-push-gate-report.md
          LOCAL_PUSH_GATE_RECEIPT_PATH: ${{ runner.temp }}/command-center-3-local-push-gate-run-receipt.json
        run: |
          # scripts/push_gate_3_0.sh mirrors:
          # -m unittest discover -s tests
          # -m unittest tests.test_command_center_migration_principles
          # npm run build
          # smoke_3_0.sh
          # scripts/bootstrap_runtime_contract.py
          # scripts/ltg_strict_closeout_evidence_spine_contract.py
          # runtime_mode_policy_rows config boundary fields:
          # configured_switch_rule / effective_external_call_rule
          # git diff --check
          # secret_high_risk_scan
          # artifact_scan
          # local_push_gate_receipt_artifact_policy_scan
          # LOCAL_PUSH_GATE_RECEIPT_PATH must be ignored when it points inside the repository
          set -o pipefail
          scripts/push_gate_3_0.sh 2>&1 | tee "$PUSH_GATE_LOG_PATH"

      - name: Summarize Command Center 3 push gate failure
        if: failure()
        run: |
          log_path="${{ runner.temp }}/command-center-3-push-gate.log"
          summary_path="${{ runner.temp }}/command-center-3-push-gate-failure-summary.md"
          last_gate_step="unknown_before_first_gate_marker"
          if [ -s "$log_path" ]; then
            last_gate_step="$(awk '/^==> / {sub(/^==> /, ""); step=$0} END {print step}' "$log_path")"
            if [ -z "$last_gate_step" ]; then
              last_gate_step="unknown_before_first_gate_marker"
            fi
          fi
          escaped_gate_step="${last_gate_step//'%'/'%25'}"
          escaped_gate_step="${escaped_gate_step//$'\n'/'%0A'}"
          escaped_gate_step="${escaped_gate_step//$'\r'/'%0D'}"
          {
            echo "### Command Center 3 Push Gate Failure"
            echo
            echo "- last_safe_gate_marker: \`$last_gate_step\`"
            echo "- full_log_artifact: \`command-center-3-push-gate-evidence-${{ github.run_id }}\`"
            echo "- boundary: safe marker only; inspect uploaded log/report/receipt before any release claim"
          } | tee "$summary_path" >> "$GITHUB_STEP_SUMMARY"
          printf '::error title=Command Center 3 push gate failure::last_safe_gate_marker=%s; artifact=command-center-3-push-gate-evidence-${{ github.run_id }}; review uploaded log/report/receipt before release claim\n' "$escaped_gate_step"

      - name: Upload Command Center 3 push gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-3-push-gate-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/command-center-3-push-gate.log
            ${{ runner.temp }}/command-center-3-push-gate-report.md
            ${{ runner.temp }}/command-center-3-push-gate-failure-summary.md
            ${{ runner.temp }}/command-center-3-local-push-gate-run-receipt.json
          if-no-files-found: warn
          retention-days: 7
