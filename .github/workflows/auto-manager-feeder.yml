name: Auto Manager Feeder

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # 每 15 分钟运行一次

jobs:
  feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run auto manager feeder
        run: python auto_manager_feeder.py
        env:
          DEEPSEEK_TOKEN_1: ${{ secrets.DEEPSEEK_TOKEN_1 }}
          DEEPSEEK_TOKEN_2: ${{ secrets.DEEPSEEK_TOKEN_2 }}
