# Command Center 3.0 runtime mode defaults.
# cache_only is the safe default: page open, render, startup, and GET cache/status
# stay read-only. live_light must remain opt-in and task/ledger governed.
# cache_only has highest priority: configured live switches may be shown safely,
# but effective automation, task creation, provider/model calls, and live profiles
# must stay false/plan_only/bootstrap_only in cache_only.
# Modes:
# - cache_only: smoke/CI/quick view, no external calls or task creation.
# - manual: explicit button or POST task only.
#   Configured live switches remain display-only in manual; no page-open,
#   startup, or searched-symbol autostart is effective without explicit POST.
# - live_light: bounded background POST task after cache render, ledger required.
# - live_full: reserved and disabled until separate authorization.
# Tushare/DeepSeek source switches remain ineffective outside live_light, and
# config rows are operator guidance, not production evidence or frontend secrets.
# Server config remains the source of truth. Status/UI surfaces may show only
# safe defaults and redacted config summaries; invalid runtime mode values must
# fall back to cache_only as [invalid_redacted] with no frontend edit/writeback.
# Credential presence may be shown only as booleans or safe labels. Raw values,
# env key names, token/key text, hashes, prompts, and provider errors must stay
# out of frontend state, logs, packets, cache, receipts, and checkpoints.
# Tushare light planning may name trade_cal when needed, daily, daily_basic,
# and moneyflow only as task-scoped target interfaces; empty or permission-denied
# results stay pending/degraded until redacted call_ledger evidence proves them.
# A configured true value is operator intent only, not an effective external call.
# Effective external work still requires mode/task gates, ledgers, redaction, and promotion.
# Runtime config never authorizes real trading, auto orders, buy/sell
# instructions, broker calls, or strategy action mutation in any mode.
# Runtime config does not prove the full live_light workflow has been implemented.
# Current acceptance markers are emitted by GET /api/bootstrap/status, not set here:
# runtime_mode_config_current_acceptance_scope =
#   runtime_mode_vocabulary_config_rows_and_contract_tests_only
# runtime_mode_config_current_acceptance_rule =
#   docs_config_contract_evidence_only_not_live_light_implementation
# runtime_mode_config_current_acceptance_excludes =
#   frontend_autostart_wiring, provider_model_executor, worker_dispatch,
#   cache_write_promotion, production_acceptance.
# They are checkpoint drift guards only, not private config keys, frontend
# autostart wiring, provider/model execution, worker dispatch, cache-write
# promotion, or production acceptance evidence.
# COMMAND_CENTER_LIVE_EXTERNAL_EXECUTION_PROFILE values plan_only,
# light_provider, and light_provider_model are future profile labels only:
# they are not executors, release switches, provider/model proof, or production evidence.
# Live-light research scope / provider-model enablement are stage vocabulary only:
# they do not create tasks, call provider/model, write cache, or prove production.
# Provider/model and frontend enablement are default-off release switches:
# configured true still stays effective false until execution-request, real
# ledgers, browser evidence, redaction, rollback, and promotion gates pass.
# COMMAND_CENTER_LIVE_LIGHT_RESEARCH_SCOPE names the target live_light chain only;
# use "bootstrap_only" for contract-only local inspections with no stage bundle.
# COMMAND_CENTER_LIVE_STARTUP_AUTOSTART is only a local task-create/reuse guard
# after cache render; even true is not provider/model execution authorization.
# COMMAND_CENTER_LIVE_SEARCH_SUBMIT_AUTOSTART is only for a confirmed symbol
# submit guard, never search typing, render, startup, or GET cache/status.
# Confirmed submit must normalize one A-share symbol and drop raw query text;
# raw search text must not enter logs, cache, frontend packets, or task receipts.
# Symbol limit, rate limit, and DeepSeek model label are budget/display settings only:
# they do not authorize provider/model calls, expose credentials, or bypass task ledgers.
# Symbol/rate budgets cap local task scope and require reuse/skip behavior on
# rate-window hits; they must not create an unbounded task queue or expand scope
# beyond current target, searched symbol, holdings, watchlist, or explicit symbols.
# DeepSeek remains explanation-only in live_light planning: not a data source,
# and never allowed to overwrite prices, holdings, factors, operation_zones,
# or strategy action.
# COMMAND_CENTER_LIVE_ALLOW_FULL_POOL remains a reserved intent flag: true must
# not enable full-pool or deep-scan work without separate live_full
# authorization, explicit worker task, ledgers, and promotion evidence.
COMMAND_CENTER_BOOTSTRAP_MODE = "cache_only"
COMMAND_CENTER_LIVE_TUSHARE_ON_OPEN = false
