# Command Center 3.0 runtime mode defaults.
# cache_only is the safe default: page open, render, startup, and GET cache/status
# stay read-only. live_light must remain opt-in and task/ledger governed.
# Modes:
# - cache_only: smoke/CI/quick view, no external calls or task creation.
# - manual: explicit button or POST task only.
# - live_light: bounded background POST task after cache render, ledger required.
# - live_full: reserved and disabled until separate authorization.
# Tushare/DeepSeek source switches remain ineffective outside live_light, and
# config rows are operator guidance, not production evidence or frontend secrets.
# A configured true value is operator intent only, not an effective external call.
# Effective external work still requires mode/task gates, ledgers, redaction, and promotion.
# Runtime config does not prove the full live_light workflow has been implemented.
# Live-light research scope / provider-model enablement are stage vocabulary only:
# they do not create tasks, call provider/model, write cache, or prove production.
COMMAND_CENTER_BOOTSTRAP_MODE = "cache_only"
COMMAND_CENTER_LIVE_TUSHARE_ON_OPEN = false
COMMAND_CENTER_LIVE_DEEPSEEK_ON_OPEN = false
COMMAND_CENTER_LIVE_SEARCH_SUBMIT_AUTOSTART = false
COMMAND_CENTER_LIVE_STARTUP_AUTOSTART = false
COMMAND_CENTER_LIVE_EXTERNAL_EXECUTION_PROFILE = "plan_only"
COMMAND_CENTER_LIVE_LIGHT_RESEARCH_SCOPE = "provider_factor_next_model"
COMMAND_CENTER_LIVE_PROVIDER_MODEL_ENABLEMENT = false
COMMAND_CENTER_LIVE_FRONTEND_ENABLEMENT = false
COMMAND_CENTER_LIVE_BOOTSTRAP_SYMBOL_LIMIT = 20
COMMAND_CENTER_LIVE_BOOTSTRAP_RATE_LIMIT_SECONDS = 600
COMMAND_CENTER_LIVE_DEEPSEEK_MODEL = "deepseek-v4-pro"
